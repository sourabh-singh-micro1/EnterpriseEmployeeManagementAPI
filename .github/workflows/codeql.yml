name: CodeQL and dependency security

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore EnterpriseEmployeeManagementAPI.sln

      - name: Build solution for analysis
        run: dotnet build EnterpriseEmployeeManagementAPI.sln --configuration Release --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp

  package-vulnerability-scan:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore EnterpriseEmployeeManagementAPI.sln

      - name: Generate vulnerability report
        shell: pwsh
        run: |
          dotnet list EnterpriseEmployeeManagementAPI.sln package --vulnerable --include-transitive --format json > vulnerable-packages.json
          $report = Get-Content vulnerable-packages.json -Raw
          if ($report -match '"severity"\s*:\s*"Critical"') {
            Write-Error "Critical NuGet vulnerability detected. Review vulnerable-packages.json."
            exit 1
          }

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-vulnerability-report
          path: vulnerable-packages.json
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
