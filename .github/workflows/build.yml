name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Restore, build, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore EnterpriseEmployeeManagementAPI.sln

      - name: Build solution
        run: dotnet build EnterpriseEmployeeManagementAPI.sln --configuration Release --no-restore

      - name: Publish API
        run: >-
          dotnet publish EnterpriseEmployeeManagementAPI/EnterpriseEmployeeManagementAPI.csproj
          --configuration Release
          --no-build
          --output artifacts/api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-employee-management-api
          path: artifacts/api
          if-no-files-found: error
          retention-days: 14
