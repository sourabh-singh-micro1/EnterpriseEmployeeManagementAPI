name: Bootstrap repository

on:
  push:
    paths:
      - "EnterpriseEmployeeManagementAPI-bootstrap-791fc77.zip"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unpack committed repository
        shell: bash
        run: |
          set -euo pipefail
          archive="EnterpriseEmployeeManagementAPI-bootstrap-791fc77.zip"
          test -f "$archive"
          temporary_directory="$(mktemp -d)"
          unzip -q "$archive" -d "$temporary_directory"
          cp -a "$temporary_directory"/. .
          rm -f "$archive" .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create enterprise employee management API"
          git push origin HEAD:main
